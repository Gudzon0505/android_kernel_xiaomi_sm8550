name: Build vermeer kernel (GKI, Lineage 23)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install deps
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex build-essential \
            clang lld llvm \
            libssl-dev libelf-dev \
            dwarves \
            python3 python3-pip \
            rsync git zip unzip \
            ccache
          which clang
          which ld.lld
# force refresh
      - name: Configure kernel (GKI + vermeer)
        run: |
          set -eux
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1

          SRC="$GITHUB_WORKSPACE"
          OUT="$RUNNER_TEMP/out"

          rm -rf "$OUT"
          mkdir -p "$OUT"

          make -C "$SRC" O="$OUT" mrproper
          make -C "$SRC" O="$OUT" gki_defconfig

          cd "$OUT"
          "$SRC/scripts/kconfig/merge_config.sh" -m -r \
            "$OUT/.config" \
            "$SRC/arch/arm64/configs/vendor/vermeer_GKI.config"

          test ! -f "$SRC/.config"
          make -C "$SRC" O="$OUT" olddefconfig

      - name: Build kernel
        run: |
          set -eux
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1

          SRC="$GITHUB_WORKSPACE"
          OUT="$RUNNER_TEMP/out"

          make -C "$SRC" -j"$(nproc)" O="$OUT" Image Image.gz

          if make -n -C "$SRC" O="$OUT" dtbo.img >/dev/null 2>&1; then
            make -C "$SRC" -j"$(nproc)" O="$OUT" dtbo.img
          fi

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp -v "$OUT/arch/arm64/boot/Image" artifacts/ || true
          cp -v "$OUT/arch/arm64/boot/Image.gz" artifacts/ || true
          cp -v "$OUT/arch/arm64/boot/dtbo.img" artifacts/ || true
          cp -v "$OUT/.config" artifacts/config || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vermeer-kernel-${{ github.sha }}
          path: artifacts/*
