name: Build vermeer kernel (GKI, Lineage 23)

on:
  workflow_dispatch:
  push:
    branches:
      - lineage-23.0

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install deps
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex build-essential \
            clang lld llvm \
            libssl-dev libelf-dev \
            dwarves \
            python3 python3-pip \
            rsync git zip unzip \
            ccache
          which clang
          which ld.lld

      - name: Configure (gki_defconfig + vermeer_GKI.config)
        run: |
          set -eux
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1

          OUT="${RUNNER_TEMP}/out"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          make O="$OUT" mrproper
          make O="$OUT" gki_defconfig

          ./scripts/kconfig/merge_config.sh -m -r \
            "$OUT/.config" arch/arm64/configs/vendor/vermeer_GKI.config

          make O="$OUT" olddefconfig
          grep -E "CONFIG_LOCALVERSION|CONFIG_LTO|CONFIG_CFI" "$OUT/.config" || true

      - name: Build
        run: |
          set -eux
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1

          OUT="${RUNNER_TEMP}/out"
          make -j"$(nproc)" O="$OUT" Image Image.gz

          if make -n O="$OUT" dtbo.img >/dev/null 2>&1; then
            make -j"$(nproc)" O="$OUT" dtbo.img
          fi

          mkdir -p artifacts
          cp -v "$OUT/arch/arm64/boot/Image" artifacts/ || true
          cp -v "$OUT/arch/arm64/boot/Image.gz" artifacts/ || true
          cp -v "$OUT/arch/arm64/boot/dtbo.img" artifacts/ || true
          cp -v "$OUT/.config" artifacts/config || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vermeer-kernel-${{ github.sha }}
          path: artifacts/*
